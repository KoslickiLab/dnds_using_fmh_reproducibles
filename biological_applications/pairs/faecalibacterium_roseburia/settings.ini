[pair]
# prefix of every LaTeX macro of this pair (letters only)
prefix = FR
# name of the figure file written to output/figures/
figure_name = bioapp_faecalibacterium_roseburia
# names used in the figure
name_a = F. duncaniae A2-165
name_b = R. inulinivorans A2-194
# regions drawn as gene maps in panel d
regions_to_draw = E1, E2, E5
# labels above single genes in panel d:  locus_tag=label; locus_tag=label
gene_labels = GXM22_RS01885=BREX; GXM22_RS01965=bile salt hydrolase; GXM22_RS00830=VirB4; GXM22_RS01785=VirB4; GXM22_RS08475=VirB4
# cells of the presence table (panel e) that the text quotes:  genome key:region
quoted_cells = Hominis:E3, Hominis:E5, Hominis:E6, Hominis:E7, OtherFd:E1, OtherFd:E2
